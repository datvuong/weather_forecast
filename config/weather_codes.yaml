# WMO weather interpretation codes (WW) as used by Open-Meteo
# =============================================================
# Seed for the dim_weather_code dimension table. Descriptions are copied
# verbatim from Open-Meteo's published mapping:
#   https://open-meteo.com/en/docs  ("WMO Weather interpretation codes")
# The other attributes are this project's analytics classification and
# can be edited (e.g. relabelled or translated) without code changes.
#
# Fields:
#   code:               WMO code (matches weather_code in the Silver tables)
#   description:        Open-Meteo's description
#   condition_group:    clear | cloudy | fog | drizzle | rain | snow | showers | thunderstorm
#   precipitation_type: none | drizzle | rain | snow | mixed | hail
#                       (mixed = WMO "rain and/or snow", used for thunderstorms without hail)
#   intensity:          none | slight | moderate | heavy | violent | unspecified
#   is_precipitation:   true for any falling precipitation (drizzle and above)
#   is_freezing:        freezing drizzle/rain and depositing rime fog
#   is_thunderstorm:    codes 95-99
#   severity_rank:      0 = least severe; follows the ascending code order
#                       (WMO codes broadly increase with severity)
#   note:               optional remark

weather_codes:
  - code: 0
    description: "Clear sky"
    condition_group: clear
    precipitation_type: none
    intensity: none
    is_precipitation: false
    is_freezing: false
    is_thunderstorm: false
    severity_rank: 0
  - code: 1
    description: "Mainly clear"
    condition_group: clear
    precipitation_type: none
    intensity: none
    is_precipitation: false
    is_freezing: false
    is_thunderstorm: false
    severity_rank: 1
