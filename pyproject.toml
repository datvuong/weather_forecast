[project]
name = "weather_forecast"
version = "0.1.0"
description = "End-to-end weather forecast data pipeline using Medallion Architecture (Dagster + DuckDB + Parquet)"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}

dependencies = [
    "dagster>=1.9",
    "dagster-webserver>=1.9",
    "dagster-duckdb>=0.25",
    "duckdb>=1.1",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pyarrow>=17.0",
    "pandas>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.22",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["weather_forecast*"]

[tool.dagster]
module_name = "weather_forecast.definitions"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.coverage.run]
source = ["weather_forecast"]
